[project]
name = "automation-hub"
version = "0.5.2"
description = "Local integration hub for automation applications and reports"
requires-python = ">=3.11"

[project.scripts]
automation-hub = "automation_hub.cli:main"
tolubay-template-report = "automation_hub.tolubay_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
